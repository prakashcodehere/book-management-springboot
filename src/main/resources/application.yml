spring:
  datasource:
    url: jdbc:mysql://mysql-db:3306/bookdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: bookuser
    password: bookpass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cache:
    type: redis

  data:
    redis:
      host: redis
      port: 6379
      timeout: 60000

server:
  port: 9090

logging:
  level:
    org.springframework.security: DEBUG
